[package]
name = "keyls"
version = "0.1.0"
edition = "2024"
authors = ["Ximon Eighteen <ximon.eighteen@gmail.com>"]
description = "Crpytographic token key lister"
repository = "https://github.com/NLnetLabs/keyls/"
keywords = ["KMIP", "PKCS#11"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
cryptoki = "^0.12"
env_logger = "0.11.11"
hex = "0.4.3"
kmip = { version = "0.5.1", package = "kmip-protocol", features = ["tls-with-rustls"] }
log = "0.4.34"
prettytable-rs = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }
